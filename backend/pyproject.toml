[project]
name = "ai-act-compliance-assistant-backend"
version = "0.1.0"
description = "Local-first FastAPI backend for first-pass EU AI Act assessments."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "anthropic>=0.28,<1.0",
    "openai>=1.30,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
